services:
  postgres:
    image: postgres:16-alpine
    container_name: mini_wfm_postgres
    restart: always
    environment:
      POSTGRES_DB: mini_wfm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
