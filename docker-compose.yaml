services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mini_wfm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: mini_wfm
      RABBITMQ_DEFAULT_PASS: local_dev_only
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 8s
      start_period: 20s
      retries: 12

  workforce-service:
    profiles: [backend]
    build: ./workforce-service
    env_file: ./workforce-service/.env
    environment:
      WORKFORCE_HOST: "0.0.0.0"
      WORKFORCE_PORT: "4001"
      DB_HOST: postgres
      DB_PORT: "5432"
      RABBITMQ_URL: &rabbitmq-url amqp://mini_wfm:local_dev_only@rabbitmq:5672
    depends_on: &infrastructure-ready
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const socket = require('node:net').connect(4001, '127.0.0.1');
          socket.on('connect', () => socket.end());
          socket.on('error', () => process.exit(1));
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  notification-service:
    profiles: [backend]
    build: ./notification-service
    env_file: ./notification-service/.env
    environment:
      NOTIFICATION_HOST: "0.0.0.0"
      NOTIFICATION_PORT: "4002"
      DB_HOST: postgres
      DB_PORT: "5432"
      RABBITMQ_URL: *rabbitmq-url
    depends_on: *infrastructure-ready
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const socket = require('node:net').connect(4002, '127.0.0.1');
          socket.on('connect', () => socket.end());
          socket.on('error', () => process.exit(1));
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  api:
    profiles: [backend]
    build: ./api
    env_file: ./api/.env
    environment:
      PORT: "3000"
      WORKFORCE_HOST: workforce-service
      WORKFORCE_PORT: "4001"
      NOTIFICATION_HOST: notification-service
      NOTIFICATION_PORT: "4002"
    ports:
      - "3000:3000"
    depends_on:
      workforce-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then(async (response) => { if (!response.ok || (await response.text()) !== 'pong') process.exitCode = 1; })
          .catch(() => { process.exitCode = 1; });
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  rabbitmq_data:
  postgres_data:
